name: Armar lista de envío a corredores
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
  push:
    paths: [herramientas/envio_corredores.py, .github/workflows/envio.yml, herramientas/envio.txt]
permissions:
  contents: write
jobs:
  envio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install gspread==6.1.2 google-auth==2.34.0
      - env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          AMPI_CSV: ${{ secrets.AMPI_CSV }}
        run: python -u herramientas/envio_corredores.py | tee herramientas/envio_resumen.txt
      - run: |
          git config user.email "claude@acierta.pro"; git config user.name "Lista de envio"
          git add herramientas/envio_resumen.txt; git diff --cached --quiet || (git commit -m "Resumen de la lista de envio (solo conteos)" && git push)
